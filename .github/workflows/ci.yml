name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, testes e avaliação determinística
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências (sem modelos, sem LLM)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pylint

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Lint (pylint)
        run: pylint src tests scripts --fail-under=10

      - name: Gerar dados sintéticos (seed fixa)
        run: copiloto generate-data

      - name: Testes
        run: pytest -q -p no:warnings

      # Gate de regressão: os 33 casos em modo determinístico devem passar 100%.
      # Qualquer caso de autorização, aprovação ou injeção que regredir derruba o build.
      - name: Avaliação determinística (gate)
        run: |
          copiloto eval --variants lexical
          python scripts/ci_gate.py --variant lexical

      - name: Publicar relatório da avaliação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: evals/results/eval-deterministico-*.json
          retention-days: 30

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ops-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
