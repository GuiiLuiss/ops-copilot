[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copiloto-operacoes"
version = "0.1.0"
description = "Copiloto de Operações: agente com RAG, consultas determinísticas e aprovação humana para um e-commerce fictício."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Luís Silva" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "streamlit>=1.37,<2",
    "langgraph>=0.2,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
vector = [
    "sentence-transformers>=3.0,<4",
    "faiss-cpu>=1.8,<2",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
copiloto = "copiloto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "ISC"]
ignore = ["B008"]  # FastAPI Depends() em defaults é o padrão do framework

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "C408"]  # fixtures pytest importadas; dict() legível em testes
